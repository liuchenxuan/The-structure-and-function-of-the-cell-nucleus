<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>细胞核功能实验探究 · 交互实验室</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:linear-gradient(135deg,#eef7ff 0%,#f3fbf5 50%,#fdf6ec 100%);min-height:100vh;color:#1e293b;overscroll-behavior:none}
.card{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 6px 20px rgba(15,23,42,.06);border:1px solid rgba(148,163,184,.18)}
.tab{padding:10px 14px;border-radius:14px;font-weight:600;font-size:14px;background:rgba(255,255,255,.7);border:1px solid rgba(148,163,184,.25);color:#475569;transition:.2s;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,#0ea5e9,#10b981);color:#fff;box-shadow:0 8px 20px rgba(14,165,233,.3);border-color:transparent}
.tab .done{display:none}.tab.solved .done{display:inline}
/* 舞台 */
.stage{position:relative;width:100%;aspect-ratio:1000/560;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 15% 15%,rgba(255,255,255,.85),transparent 45%),linear-gradient(135deg,#dbeafe,#dcfce7 60%,#fef3c7);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 10px 30px rgba(15,23,42,.08);touch-action:none}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.world{position:absolute;left:0;top:0;width:1000px;height:560px;transform-origin:0 0;font-size:15px}
.item{position:absolute;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.item.nodrag{cursor:default}
.item.dragging{cursor:grabbing}
.item img,.item svg{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.item img.ph{object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;font-size:14px;white-space:nowrap;background:rgba(255,255,255,.9);padding:2px 8px;border-radius:8px;color:#334155;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.08);font-weight:500}
.lbl:empty{display:none}
.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(34,197,94,.9))}50%{filter:drop-shadow(0 0 16px rgba(34,197,94,1))}}
.hintdrag{animation:hint 1.2s ease-in-out infinite}
@keyframes hint{0%,100%{filter:drop-shadow(0 0 3px rgba(245,158,11,.9))}50%{filter:drop-shadow(0 0 14px rgba(245,158,11,1))}}
.hinttarget::after{content:"";position:absolute;inset:-12px;border:2px dashed rgba(59,130,246,.75);border-radius:16px;pointer-events:none}
.dim{opacity:.45;filter:grayscale(.6)}
.cap{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(15,23,42,.78);color:#fff;padding:6px 16px;border-radius:999px;font-size:13px;pointer-events:none;transition:opacity .3s;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:20}
.cap:empty{opacity:0}
.banner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0f766e;background:rgba(255,255,255,.7);border-radius:999px;border:1px solid rgba(13,148,136,.3);font-size:15px}
/* 细胞 */
.cell{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8ea,#f6d7a8 60%,#e8b97a);border:3px solid rgba(180,130,70,.7);box-shadow:inset 0 0 20px rgba(255,255,255,.6),0 4px 10px rgba(0,0,0,.15);transition:box-shadow .4s,opacity .4s,background .4s}
.empty .cell{opacity:.6}
.recomb .cell{box-shadow:0 0 0 4px rgba(168,85,247,.35),0 0 26px rgba(168,85,247,.7),inset 0 0 20px rgba(255,255,255,.6)}
.cell.dividing{background:rgba(255,255,255,.3);border-color:rgba(180,130,70,.35)}
.nuc{width:100%;height:100%;border-radius:50%;border:2px solid #3b0764;box-shadow:0 2px 6px rgba(0,0,0,.3);position:relative}
.nuc::after{content:"";position:absolute;left:30%;top:30%;width:22%;height:22%;border-radius:50%;background:rgba(255,255,255,.5)}
.nuc-dark{background:radial-gradient(circle at 35% 35%,#a78bfa,#5b21b6 65%,#2e1065)}
.nuc-light{background:radial-gradient(circle at 35% 35%,#ede9fe,#a78bfa 65%,#7c3aed)}
.nuc-amo{background:radial-gradient(circle at 35% 35%,#fbcfe8,#be185d 65%,#831843);border-color:#500724}
/* 变形虫 */
.blob{width:100%;height:100%;background:radial-gradient(circle at 40% 40%,rgba(255,248,214,.97),rgba(226,200,130,.9));border:3px solid rgba(150,120,60,.65);border-radius:60% 40% 55% 45%/50% 60% 40% 50%;animation:blob 6s ease-in-out infinite;box-shadow:0 6px 14px rgba(0,0,0,.12);position:relative;overflow:hidden;transition:filter 1s,opacity 1s}
.blob::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 65%,rgba(120,90,40,.25) 0 5%,transparent 6%),radial-gradient(circle at 70% 30%,rgba(120,90,40,.25) 0 4%,transparent 5%),radial-gradient(circle at 65% 72%,rgba(120,90,40,.2) 0 4%,transparent 5%),radial-gradient(circle at 35% 25%,rgba(120,90,40,.2) 0 3%,transparent 4%)}
@keyframes blob{0%,100%{border-radius:60% 40% 55% 45%/50% 60% 40% 50%}33%{border-radius:42% 58% 38% 62%/62% 42% 58% 38%}66%{border-radius:55% 45% 62% 38%/40% 58% 42% 60%}}
.dying .blob{animation-duration:40s;filter:grayscale(.95);opacity:.5}
.revived .blob{animation-duration:4s;box-shadow:0 0 0 4px rgba(34,197,94,.3),0 0 22px rgba(34,197,94,.7)}
.food{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#bbf7d0,#16a34a);border:2px solid #14532d}
/* 按钮 */
.btn{padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;transition:.2s;border:1px solid transparent}
.btn-run{background:linear-gradient(135deg,#10b981,#059669);color:#fff;flex:1}
.btn-run:disabled{opacity:.4;cursor:not-allowed}
.btn-run.ready:not(:disabled){animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}50%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}
.btn-reset{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
.btn-reset:hover{background:#e2e8f0}
.log{list-style:decimal;padding-left:20px;font-size:13px;color:#475569;max-height:170px;overflow:auto;line-height:1.6}
.log li{margin:2px 0;animation:fadein .4s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.blank{display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid #f59e0b;color:#f59e0b;font-weight:700;padding:0 4px;transition:.3s}
.blank.ok{color:#059669;border-color:#059669;background:rgba(16,185,129,.1);border-radius:6px}
.opt{padding:6px 14px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;font-size:13px;font-weight:600;color:#334155;transition:.2s}
.opt:hover:not(:disabled){border-color:#10b981;color:#059669}
.opt.right{background:#10b981;color:#fff;border-color:#10b981}
.opt.wrong{background:#fee2e2;color:#b91c1c;border-color:#fca5a5;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.refwrap img{height:60px;width:auto;max-width:110px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid #e2e8f0;cursor:zoom-in;transition:.2s;padding:2px}
.refwrap img:hover{transform:scale(1.05);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.hint b{color:#b45309;background:#fef3c7;padding:0 4px;border-radius:4px}
.badge{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:#e2e8f0;color:#64748b;transition:.3s}
.badge.on{background:linear-gradient(135deg,#10b981,#0ea5e9);color:#fff;box-shadow:0 4px 10px rgba(16,185,129,.35)}
#summary{animation:fadein .6s}
</style>
</head>

<div class="max-w-7xl mx-auto px-3 sm:px-5 py-4 sm:py-6">

    <p class="mt-3 font-bold text-slate-800 text-base">结论：细胞核是遗传信息库，是细胞<span class="text-emerald-600">代谢</span>和<span class="text-emerald-600">遗传</span>的控制中心。</p>
  </section>

  <footer class="text-center text-xs text-slate-400 mt-6">The-structure-and-function-of-the-cell-nucleus</footer>
</div>

<!-- 灯箱 -->
<div id="lightbox" class="hidden fixed inset-0 bg-black/70 z-50 items-center justify-center p-4" onclick="this.classList.add('hidden');this.classList.remove('flex')">
  <img id="lightimg" class="max-w-full max-h-full rounded-xl shadow-2xl bg-white" alt="">

<script>
/* ========================= 基础配置 ========================= */
const REPO='https://raw.githubusercontent.com/liuchenxuan/The-structure-and-function-of-the-cell-nucleus/main/';
const IMG={
  axBlack:'Experment1/图片2.png',   // 若与实际肤色不符，可点击面板里的「交换」按钮
  axWhite:'Experment1/图片3.png',
  e1:['Experment1/图片2.png','Experment1/图片3.png'],
  e2:['Experment2/图片4.png','Experment2/图片5.png'],
  e3:['Experment3/图片6.png'],
  e4:['20261026210257','20261026210311','20261026210329','20261026210349','20261026210357','20261026210407','20261026210420','20261026210441','20261026210454'].map(n=>'Experment4/'+n+'.png')
};
const W=1000,H=560;
const $=(s,r=document)=>r.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const svgData=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);

function imgTag(p,cls='',fb=''){
  return `<img src="./${encodeURI(p)}" data-alts="${REPO+encodeURI(p)}" data-fb="${fb}" class="${cls}" onerror="imgErr(this)" draggable="false" alt="">`;
}
window.imgErr=function(img){
  const alts=(img.dataset.alts||'').split('|').filter(Boolean);
  if(alts.length){img.src=alts.shift();img.dataset.alts=alts.join('|');}
  else if(img.dataset.fb){img.onerror=null;img.src=img.dataset.fb;img.dataset.fb='';}
  else{img.onerror=null;const w=img.closest('.refwrap');if(w)w.remove();else img.style.display='none';}
};

/* ========================= SVG 素材 ========================= */
const axSVG=(body,gill,eye='#111')=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120"><path d="M50 30 C70 30 72 60 60 95 C56 108 44 108 40 95 C28 60 30 30 50 30 Z" fill="${body}" stroke="#555" stroke-width="2"/><g stroke="#555" stroke-width="2" fill="${body}"><path d="M38 60 l-14 8 l4 4 l12 -8"/><path d="M62 60 l14 8 l-4 4 l-12 -8"/><path d="M42 88 l-12 10 l5 3 l9 -9"/><path d="M58 88 l12 10 l-5 3 l-9 -9"/></g><circle cx="50" cy="32" r="20" fill="${body}" stroke="#555" stroke-width="2"/><g stroke="${gill}" stroke-width="4" stroke-linecap="round"><path d="M32 22 l-12 -8"/><path d="M31 30 l-14 -2"/><path d="M32 38 l-12 6"/><path d="M68 22 l12 -8"/><path d="M69 30 l14 -2"/><path d="M68 38 l12 6"/></g><circle cx="42" cy="30" r="2.5" fill="${eye}"/><circle cx="58" cy="30" r="2.5" fill="${eye}"/><path d="M44 40 q6 4 12 0" fill="none" stroke="${eye}" stroke-width="1.5"/></svg>`;
const SVG={
  pipette:`<svg viewBox="0 0 60 140"><rect x="18" y="4" width="24" height="34" rx="12" fill="#bae6fd" stroke="#0369a1" stroke-width="2"/><rect x="26" y="36" width="8" height="70" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><path d="M26 106 L30 136 L34 106 Z" fill="#bfdbfe" stroke="#0369a1" stroke-width="2"/></svg>`,
  needle:`<svg viewBox="0 0 50 140"><rect x="17" y="4" width="16" height="62" rx="5" fill="#cbd5e1" stroke="#475569" stroke-width="2"/><rect x="21" y="12" width="8" height="40" fill="#94a3b8" opacity=".6"/><path d="M22 66 L25 136 L28 66 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/></svg>`,
  scalpel:`<svg viewBox="0 0 120 70"><rect x="4" y="27" width="62" height="16" rx="7" fill="#475569"/><rect x="12" y="31" width="40" height="3" fill="#94a3b8" opacity=".7"/><path d="M60 23 L116 35 L60 47 Z" fill="#f1f5f9" stroke="#475569" stroke-width="2"/></svg>`,
  hair:`<svg viewBox="0 0 120 80"><path d="M10 40 C30 4 90 4 110 40 C90 76 30 76 10 40 Z" fill="none" stroke="#3b2f1e" stroke-width="2.5"/><path d="M8 40 l-7 0 M112 40 l7 0" stroke="#3b2f1e" stroke-width="2.5"/></svg>`,
  dish:`<svg viewBox="0 0 240 180"><ellipse cx="120" cy="104" rx="114" ry="62" fill="rgba(186,230,253,.55)" stroke="#60a5fa" stroke-width="3"/><ellipse cx="120" cy="94" rx="114" ry="62" fill="rgba(255,255,255,.25)" stroke="#93c5fd" stroke-width="2"/><path d="M6 94 v10 M234 94 v10" stroke="#60a5fa" stroke-width="3"/></svg>`
};
function clusterSVG(cx,cy,R,n,fill='#fde9c9',stroke='#b8864e'){
  const rings={1:[[1,0]],2:[[2,.5]],4:[[4,.52]],8:[[1,0],[7,.64]],16:[[1,0],[5,.4],[10,.75]]}[n];
  const r={1:R*.95,2:R*.5,4:R*.45,8:R*.33,16:R*.23}[n];
  let s='';
  rings.forEach(([cnt,fr])=>{for(let i=0;i<cnt;i++){const a=i/cnt*Math.PI*2-Math.PI/2;const x=(cx+Math.cos(a)*fr*R).toFixed(1),y=(cy+Math.sin(a)*fr*R).toFixed(1);
    s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="${r*.3}" fill="#7c3aed" opacity=".85"/>`;}});
  return s;
}
const embryoSVG=(cx,cy)=>`<g transform="translate(${cx},${cy})"><path d="M-40,5 C-40,-30 20,-35 35,-10 C45,8 25,25 5,22 C-10,20 -20,35 -38,28 C-48,24 -45,12 -40,5 Z" fill="#d9b382" stroke="#8a5a2b" stroke-width="2"/><circle cx="22" cy="-8" r="4" fill="#3b2f1e"/><path d="M-5,0 C5,-12 15,-14 25,-6" fill="none" stroke="#8a5a2b" stroke-width="1.5"/></g>`;
function eggPath(k){const h=Math.max(3,60*(1-k));return `M70,20 A60,60 0 1,0 70,140 C95,140 105,${80+h} 120,${80+h} C135,${80+h} 145,140 170,140 A60,60 0 1,0 170,20 C145,20 135,${80-h} 120,${80-h} C105,${80-h} 95,20 70,20 Z`;}
const eggSVG=()=>`<svg viewBox="0 0 240 160" style="overflow:visible"><defs><radialGradient id="e2g" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff5e1"/><stop offset=".7" stop-color="#f3cf98"/><stop offset="1" stop-color="#e0ad6c"/></radialGradient></defs><path class="eggp" d="${eggPath(0)}" fill="url(#e2g)" stroke="#b8864e" stroke-width="3"/><g class="clL"></g><g class="clR"></g><text class="tL" x="70" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#166534" opacity="0">有核半</text><text class="tR" x="170" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#9f1239" opacity="0">无核半</text></svg>`;
/* 伞藻 */
const SP={M:{name:'地中海伞藻',fill:'#34a37a',stroke:'#1f6f52',shape:'伞形'},C:{name:'菊花形伞藻',fill:'#9bc53d',stroke:'#5c7f1a',shape:'菊花形'}};
function capSVG(type){const {fill,stroke}=SP[type];
  if(type==='M'){let ribs='';for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ribs+=`<line x1="50" y1="30" x2="${(50+46*Math.cos(a)).toFixed(1)}" y2="${(30+22*Math.sin(a)).toFixed(1)}" stroke="${stroke}" stroke-width="1.5" opacity=".7"/>`;}
    return `<svg viewBox="0 0 100 56" style="overflow:visible"><ellipse cx="50" cy="30" rx="46" ry="22" fill="${fill}" stroke="${stroke}" stroke-width="2"/>${ribs}<circle cx="50" cy="30" r="5" fill="${stroke}"/></svg>`;}
  let p='';for(let i=0;i<12;i++){p+=`<ellipse cx="50" cy="12" rx="8" ry="16" fill="${fill}" stroke="${stroke}" stroke-width="1.5" transform="rotate(${i*30} 50 32)"/>`;}
  return `<svg viewBox="0 0 100 64" style="overflow:visible">${p}<circle cx="50" cy="32" r="11" fill="${stroke}"/></svg>`;}
const stalkSVG=sp=>`<svg viewBox="0 0 18 150"><path d="M4,0 L14,0 L16,150 L2,150 Z" fill="${SP[sp].fill}" stroke="${SP[sp].stroke}" stroke-width="1.5"/></svg>`;
const rhizSVG=sp=>`<svg viewBox="0 0 100 60" style="overflow:visible"><g fill="none" stroke="${SP[sp].fill}" stroke-width="9" stroke-linecap="round"><path d="M50,8 C48,25 30,30 12,48"/><path d="M50,8 C52,25 70,30 88,48"/><path d="M50,8 C50,28 42,40 34,58"/><path d="M50,8 C50,28 58,40 66,58"/></g><circle cx="50" cy="12" r="13" fill="${SP[sp].fill}" stroke="${SP[sp].stroke}" stroke-width="1.5"/></svg>`;

/* ========================= 舞台引擎（拖拽 + 动画） ========================= */
class Stage{
  constructor(root){this.root=root;this.world=$('.world',root);this.capEl=$('.cap',root);this.items=new Map();this.locked=false;this.onDrop=null;this.scale=1;this.fit();new ResizeObserver(()=>this.fit()).observe(root);}
  fit(){const w=this.root.clientWidth;if(!w)return;this.scale=w/W;this.world.style.transform=`scale(${this.scale})`;}
  add(cfg){
    const el=document.createElement('div');el.className='item'+(cfg.cls?' '+cfg.cls:'')+(cfg.drag===false?' nodrag':'');el.dataset.id=cfg.id;
    Object.assign(el.style,{left:cfg.x+'px',top:cfg.y+'px',width:cfg.w+'px',height:cfg.h+'px',zIndex:cfg.z??1});
    el.innerHTML=cfg.html+`<span class="lbl">${cfg.label||''}</span>`;
    const it={...cfg,el,followers:[],drag:cfg.drag!==false,z:cfg.z??1};
    this.world.appendChild(el);this.items.set(cfg.id,it);this.bindDrag(it);return it;
  }
  get(id){return this.items.get(id);}
  remove(it){if(!it)return;this.unfollow(it);it.followers.forEach(f=>this.unfollow(f));it.el.remove();this.items.delete(it.id);}
  clear(){this.items.forEach(it=>it.el.remove());this.items.clear();this.caption('');}
  follow(parent,child){this.unfollow(child);parent.followers.push(child);child.parent=parent;}
  unfollow(child){if(child.parent){child.parent.followers=child.parent.followers.filter(f=>f!==child);child.parent=null;}}
  setPos(it,x,y){it.x=x;it.y=y;it.el.style.left=x+'px';it.el.style.top=y+'px';}
  bindDrag(it){
    it.el.addEventListener('pointerdown',e=>{
      if(this.locked||!it.drag)return;e.preventDefault();e.stopPropagation();
      const el=it.el;try{el.setPointerCapture(e.pointerId);}catch(_){}
      const sx=e.clientX,sy=e.clientY,ox=it.x,oy=it.y;const fol=it.followers.map(f=>({f,x:f.x,y:f.y}));
      el.classList.add('dragging');el.style.zIndex=60;el.style.transition='';
      const move=ev=>{const dx=(ev.clientX-sx)/this.scale,dy=(ev.clientY-sy)/this.scale;
        this.setPos(it,clamp(ox+dx,-it.w*.4,W-it.w*.6),clamp(oy+dy,-it.h*.3,H-it.h*.5));fol.forEach(o=>this.setPos(o.f,o.x+dx,o.y+dy));this.onDrop&&this.onDrop(it,'move');};
      const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);el.classList.remove('dragging');el.style.zIndex=it.z;this.onDrop&&this.onDrop(it,'drop');};
      el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
    });
  }
  center(it){return {x:it.x+it.w/2,y:it.y+it.h/2};}
  dist(a,b){const p=this.center(a),q=this.center(b);return Math.hypot(p.x-q.x,p.y-q.y);}
  over(a,b,pad=0){if(!a||!b)return false;const c=this.center(a);return c.x>b.x-pad&&c.x<b.x+b.w+pad&&c.y>b.y-pad&&c.y<b.y+b.h+pad;}
  moveTo(it,x,y,ms=800,withF=true){
    const dx=x-it.x,dy=y-it.y;const ps=[];
    if(withF)it.followers.forEach(f=>ps.push(this.moveTo(f,f.x+dx,f.y+dy,ms,false)));
    ps.push(new Promise(res=>{it.el.style.transition=`left ${ms}ms ease-in-out, top ${ms}ms ease-in-out`;requestAnimationFrame(()=>{this.setPos(it,x,y);setTimeout(()=>{it.el.style.transition='';res();},ms+30);});}));
    return Promise.all(ps);
  }
  resize(it,w,h,ms=600){return new Promise(res=>{it.el.style.transition=`width ${ms}ms ease, height ${ms}ms ease`;requestAnimationFrame(()=>{it.w=w;it.h=h;it.el.style.width=w+'px';it.el.style.height=h+'px';setTimeout(()=>{it.el.style.transition='';res();},ms+30);});});}
  fade(it,to=0,ms=600){return new Promise(res=>{it.el.style.transition=`opacity ${ms}ms`;requestAnimationFrame(()=>{it.el.style.opacity=to;setTimeout(()=>{it.el.style.transition='';res();},ms+30);});});}
  grow(it,ms=1200){it.el.style.transformOrigin='50% 100%';it.el.style.transform='scale(0)';return new Promise(res=>{requestAnimationFrame(()=>requestAnimationFrame(()=>{it.el.style.transition=`transform ${ms}ms cubic-bezier(.2,.8,.3,1.25)`;it.el.style.transform='scale(1)';setTimeout(()=>{it.el.style.transition='';res();},ms+30);}));});}
  label(it,t){$('.lbl',it.el).textContent=t;}
  caption(t){this.capEl.textContent=t;}
}

const EXPS=[];
class Experiment{
  constructor(cfg){this.cfg=cfg;this.id=cfg.id;this.steps=cfg.steps;this.step=0;this.running=false;this.done=false;this.solved=false;this.build();}
  build(){
    const p=document.createElement('section');p.className='exp-panel hidden';p.id='panel-'+this.id;
    p.innerHTML=`
    <div class="flex flex-wrap items-start justify-between gap-3 mb-3">
      <div class="max-w-3xl"><h2 class="text-lg sm:text-xl font-extrabold text-slate-800">${this.cfg.title}</h2><p class="text-xs sm:text-sm text-slate-600 mt-1 leading-6">${this.cfg.purpose}</p></div>
      <div class="flex items-center gap-2 flex-wrap"><span class="text-xs text-slate-400">资料图：</span>${this.cfg.refs.map(r=>`<span class="refwrap">${imgTag(r,'ref')}</span>`).join('')}</div>
    </div>
    <div class="grid gap-4 lg:grid-cols-[minmax(0,1fr)_300px]">
      <div><div class="stage"><div class="world"></div><div class="cap"></div></div></div>
      <aside class="flex flex-col gap-3">
        <div class="card">
          <div class="flex items-center justify-between"><span class="text-xs font-bold text-slate-400">当前步骤</span><span class="stepno text-xs font-bold text-sky-600"></span></div>
          <div class="hint text-sm leading-6 mt-1 text-slate-700"></div>
          <div class="flex gap-2 mt-3"><button class="btn btn-run" disabled>▶ 执行</button><button class="btn btn-reset">↺ 重置</button></div>
          ${this.cfg.extra||''}
        </div>
        <div class="card"><div class="font-bold text-sm text-slate-700 mb-1">🧪 实验记录</div><ol class="log"></ol></div>
        <div class="card concl hidden" style="background:linear-gradient(135deg,#f0fdf4,#eff6ff)"></div>
      </aside>
    </div>`;
    $('#panels').appendChild(p);
    this.panel=p;this.S=new Stage($('.stage',p));this.hint=$('.hint',p);this.stepNo=$('.stepno',p);this.btnRun=$('.btn-run',p);this.logEl=$('.log',p);this.concl=$('.concl',p);
    this.btnRun.onclick=()=>this.run();$('.btn-reset',p).onclick=()=>this.reset();
    this.S.onDrop=()=>this.checkReady();
    this.cfg.setup(this);this.renderStep();
  }
  caption(t){this.S.caption(t);}
  log(t){const li=document.createElement('li');li.textContent=t;this.logEl.appendChild(li);this.logEl.scrollTop=this.logEl.scrollHeight;}
  renderStep(){
    this.S.items.forEach(it=>it.el.classList.remove('glow','hintdrag','hinttarget'));
    const s=this.steps[this.step];if(!s)return;
    this.stepNo.textContent=`${this.step+1} / ${this.steps.length}`;this.hint.innerHTML=s.hint;
    [].concat(s.tool||[]).forEach(id=>{const it=this.S.get(id);it&&it.el.classList.add('hintdrag');});
    [].concat(s.target||[]).forEach(id=>{const it=this.S.get(id);it&&it.el.classList.add('hinttarget');});
    this.checkReady();
  }
  checkReady(){
    if(this.running||this.done)return;const s=this.steps[this.step];if(!s)return;
    const ok=s.check?!!s.check(this):true;this.ready=ok;this.btnRun.disabled=!ok;this.btnRun.classList.toggle('ready',ok);
    [].concat(s.target||[]).forEach(id=>{const t=this.S.get(id);t&&t.el.classList.toggle('glow',ok);});
  }
  async run(){
    if(!this.ready||this.running||this.done)return;const s=this.steps[this.step];
    this.running=true;this.S.locked=true;this.btnRun.disabled=true;this.btnRun.classList.remove('ready');this.btnRun.textContent='⏳ 执行中…';
    this.S.items.forEach(it=>it.el.classList.remove('glow','hintdrag','hinttarget'));
    try{await s.run(this);}catch(e){console.error(e);}
    if(s.log)this.log(s.log);
    this.step++;this.running=false;this.S.locked=false;this.btnRun.textContent='▶ 执行';
    if(this.step>=this.steps.length)this.finish();else this.renderStep();
  }
  finish(){
    this.done=true;this.btnRun.disabled=true;this.stepNo.textContent='完成';
    this.hint.innerHTML='🎉 所有步骤已完成！请在下方选择正确答案，填写实验结论。';
    const c=this.cfg.conclusion,box=this.concl;box.classList.remove('hidden');
    box.innerHTML=`<div class="font-extrabold text-emerald-700 mb-1">📌 实验结论</div><p class="text-sm leading-8 text-slate-800 font-medium">${c.text.replace('__','<span class="blank">？</span>')}</p><div class="flex flex-wrap gap-2 mt-2">${c.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div class="note hidden text-xs text-slate-600 mt-3 leading-6"></div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(+b.dataset.i===c.answer){const bl=$('.blank',box);bl.textContent=c.options[c.answer];bl.classList.add('ok');b.classList.add('right');box.querySelectorAll('.opt').forEach(x=>x.disabled=true);const n=$('.note',box);n.classList.remove('hidden');n.innerHTML='✅ 回答正确！'+c.note;this.solved=true;updateProgress();}
      else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),600);}
    });
    box.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  reset(){this.S.clear();this.step=0;this.running=false;this.done=false;this.ready=false;this.S.locked=false;this.logEl.innerHTML='';this.concl.classList.add('hidden');this.concl.innerHTML='';this.btnRun.textContent='▶ 执行';this.cfg.setup(this);this.renderStep();}
}

  ],
  conclusion:{text:'伞藻伞帽形状的遗传由（__）控制。',options:['伞柄','细胞核','假根中的细胞质'],answer:1,note:'嫁接实验说明伞帽形状与假根有关；核移植实验进一步排除了细胞质的影响，证明<b>伞帽形状由细胞核控制</b>。'}
});

/* ========================= 页面组装 ========================= */
const tabsEl=$('#tabs'),badgesEl=$('#badges');
EXPS.forEach((cfg,i)=>{
  const b=document.createElement('button');b.className='tab';b.innerHTML=`<span class="opacity-70 mr-1">${i+1}</span>${cfg.short}<span class="done ml-1">✅</span>`;b.onclick=()=>show(i);tabsEl.appendChild(b);cfg.tab=b;
  const bd=document.createElement('span');bd.className='badge';bd.textContent=i+1;badgesEl.appendChild(bd);cfg.badge=bd;
  cfg.inst=new Experiment(cfg);
});
function show(i){EXPS.forEach((c,j)=>{c.tab.classList.toggle('active',i===j);c.inst.panel.classList.toggle('hidden',i!==j);});requestAnimationFrame(()=>EXPS[i].inst.S.fit());window.scrollTo({top:0,behavior:'smooth'});}
function updateProgress(){let n=0;EXPS.forEach(c=>{const ok=c.inst.solved;c.badge.classList.toggle('on',ok);c.tab.classList.toggle('solved',ok);if(ok)n++;});if(n===EXPS.length){const s=$('#summary');s.classList.remove('hidden');s.scrollIntoView({behavior:'smooth',block:'center'});}}
document.addEventListener('click',e=>{const img=e.target.closest('img.ref');if(img){$('#lightimg').src=img.src;const lb=$('#lightbox');lb.classList.remove('hidden');lb.classList.add('flex');}});
show(0);
</script>
